<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Store -  Create Order</title>
</head>
<body>
    <header>
        <h1>🛠️ Hardware Store Management System</h1>
        <h2>Create New Customer Order</h2>
    </header>

    <main>

        <form action="../server/create_order.php" method="POST">
            <fieldset>
                <legend>Customer Information</legend>
                <div>
                    <label for="orderId">Order Code: </label>
                    <input type="text" id="orderId" name="orderId" required>
                </div>
                <br>
                <div>
                    <label for="clientName">Full Name</label>
                    <input type="text" id="clientName" name="clientName" required>
                </div>
                <br>
                <div>
                    <label for="address">Physical Address</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <br>
                <div>
                    <label for="email">Email Address</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
            </fieldset>

            <br>
            <fieldset>
                <legend>Hardware Products Selection</legend>

                <div>
                    <input type="checkbox" id="item1_check" name="products[hammer][active]"> 
                    <label for="item1_check">Hammer - $15.00 </label>
                    <label for="item1_quantity">Quantity: </label>
                    <input type="number" id="item1_quantity" name="products[hammer][active]" min="1" value="1">
                </div>
                <br>

                <div>
                    <input type="checkbox" id="item2_check" name="products[drill][active]" value="1">
                    <label for="item2_check">Drill - $85.00</label>
                    <label for="item2_quantity">Quantity:</label>
                    <input type="number" id="item2_quantity" name="products[drill][active]" min="1" value="1">
                </div>
                <br>

                <div>
                    <input type="checkbox" id="item3_check" name="products[screws][active]" value="1">
                    <label for="item3_check">Screws Box - $8.00</label>
                    <label for="item3_quantity">Quantity:</label>
                    <input type="number" id="item3_quantity" name="products[screws][active]" min="1" value="1">
                </div>

                <br>
                <div>
                    <input type="checkbox" id="item4_check" name="products[nails][active]" value="1">
                    <label for="item4_check">Nails Pack - $3.50</label>
                    <label for="item4_quantity">Quantity:</label>
                    <input type="number" id="item4_quantity" name="products[nails][active]" min="1" value="1">
                </div>
            </fieldset>
            <br>

            <button type="submit">Calculate and Submit Order</button>
        </form>

        <br>

        <nav>
            <a href="menu.html">
                <button type="button">Back to Operations Menu</button>
            </a>
            <a href="index.html">
                <button type="button">Back to Home</button>
            </a>
        </nav>
    </main>
    
</body>
</html>
